[project]
name = "vellum"
version = "0.1.0"
description = "The Precision ODM for Asynchronous MongoDB & Pydantic."
authors = [
    {name = "bentafat wail", email = "150479778+wailbentafat@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mongodb", "odm", "pydantic", "async", "motor", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "motor>=3.2,<4.0",
    "pymongo>=4.0,<5.0",
    "cryptography>=44.0",
]

[project.urls]
Homepage = "https://github.com/wailbentafat/vellum"
Repository = "https://github.com/wailbentafat/vellum"
Documentation = "https://github.com/wailbentafat/vellum"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^0.23.0"
ruff = "^0.12.0"
mkdocs-material = "^9.6.14"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

